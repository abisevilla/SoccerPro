<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#8aa4c4"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#0b1424"/>
  <text x="800" y="60" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#f8fafc">SoccerPro · Database Diagram</text>
  <text x="800" y="94" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#9fb4cf">SQLite in-memory · Entity Framework Core · Logical relationships</text>

  <g stroke="#8aa4c4" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M400 360 C520 360 570 300 650 300"/>
    <path d="M400 430 C520 460 565 510 650 510"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a9bdd6">
    <text x="508" y="325">1</text><text x="615" y="315">N</text>
    <text x="508" y="478">1</text><text x="615" y="500">N</text>
  </g>

  <g font-family="Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(90 220)">
      <rect width="310" height="290" rx="14" fill="#172a44" stroke="#38bdf8" stroke-width="2"/>
      <rect width="310" height="58" rx="14" fill="#0e7490"/><rect y="44" width="310" height="14" fill="#0e7490"/>
      <text x="24" y="37" font-size="22" font-weight="700" fill="#fff">TEAMS</text><text x="240" y="36" font-size="13" fill="#c7f9ff">TABLE</text>
      <g font-size="16" fill="#e2e8f0"><text x="24" y="91" fill="#facc15">🔑  Id  : GUID  PK</text><text x="24" y="127">Name : TEXT</text><text x="24" y="163">City : TEXT  nullable</text><text x="24" y="199">CreatedAt : DATETIMEOFFSET</text><text x="24" y="235">ModifiedAt : DATETIMEOFFSET nullable</text></g>
      <text x="24" y="270" font-size="14" fill="#67e8f9">UNIQUE INDEX: Name</text>
    </g>
    <g transform="translate(650 170)">
      <rect width="300" height="290" rx="14" fill="#172a44" stroke="#a78bfa" stroke-width="2"/>
      <rect width="300" height="58" rx="14" fill="#6d28d9"/><rect y="44" width="300" height="14" fill="#6d28d9"/>
      <text x="24" y="37" font-size="22" font-weight="700" fill="#fff">PLAYERS</text><text x="230" y="36" font-size="13" fill="#ede9fe">TABLE</text>
      <g font-size="16" fill="#e2e8f0"><text x="24" y="91" fill="#facc15">🔑  Id  : GUID  PK</text><text x="24" y="127" fill="#c4b5fd">🔗  TeamId : GUID  FK</text><text x="24" y="163">Name : TEXT</text><text x="24" y="199">Position : TEXT</text><text x="24" y="235">CreatedAt : DATETIMEOFFSET</text><text x="24" y="270">ModifiedAt : DATETIMEOFFSET nullable</text></g>
    </g>
    <g transform="translate(650 540)">
      <rect width="300" height="330" rx="14" fill="#172a44" stroke="#fb7185" stroke-width="2"/>
      <rect width="300" height="58" rx="14" fill="#be123c"/><rect y="44" width="300" height="14" fill="#be123c"/>
      <text x="24" y="37" font-size="22" font-weight="700" fill="#fff">MATCHES</text><text x="230" y="36" font-size="13" fill="#ffe4e6">TABLE</text>
      <g font-size="16" fill="#e2e8f0"><text x="24" y="91" fill="#facc15">🔑  Id : GUID  PK</text><text x="24" y="127" fill="#fda4af">🔗  HomeTeamId : GUID  FK</text><text x="24" y="163" fill="#fda4af">🔗  AwayTeamId : GUID  FK</text><text x="24" y="199">ScheduledAt : DATETIMEOFFSET</text><text x="24" y="235">HomeScore : INTEGER nullable</text><text x="24" y="271">AwayScore : INTEGER nullable</text><text x="24" y="307">CreatedAt : DATETIMEOFFSET</text><text x="24" y="343">ModifiedAt : DATETIMEOFFSET nullable</text></g>
    </g>
    <g transform="translate(1200 260)">
      <rect width="310" height="290" rx="14" fill="#172a44" stroke="#34d399" stroke-width="2"/>
      <rect width="310" height="58" rx="14" fill="#047857"/><rect y="44" width="310" height="14" fill="#047857"/>
      <text x="24" y="37" font-size="21" font-weight="700" fill="#fff">IDEMPOTENCY</text><text x="250" y="36" font-size="13" fill="#d1fae5">TABLE</text>
      <g font-size="16" fill="#e2e8f0"><text x="24" y="91" fill="#facc15">🔑  Id : GUID  PK</text><text x="24" y="127">Key : TEXT</text><text x="24" y="163">RequestHash : TEXT</text><text x="24" y="199">StatusCode : INTEGER</text><text x="24" y="235">ResponseBody : TEXT</text><text x="24" y="271">Location : TEXT nullable</text></g>
      <text x="24" y="307" font-size="14" fill="#6ee7b7">UNIQUE INDEX: Key</text>
    </g>
  </g>

  <g font-family="Segoe UI,Arial,sans-serif" font-size="15">
    <rect x="96" y="700" width="400" height="150" rx="12" fill="#111f35" stroke="#334d6e"/>
    <text x="120" y="735" font-weight="700" fill="#cbd5e1">LEGEND</text><text x="120" y="770" fill="#facc15">🔑 Primary Key</text><text x="120" y="802" fill="#c4b5fd">🔗 Foreign Key</text><text x="300" y="770" fill="#94a3b8">1 : 1 lado principal</text><text x="300" y="802" fill="#94a3b8">N : muchos registros</text>
    <rect x="1070" y="700" width="440" height="150" rx="12" fill="#111f35" stroke="#334d6e"/>
    <text x="1095" y="735" font-weight="700" fill="#cbd5e1">NOTAS DE IMPLEMENTACIÓN</text><text x="1095" y="770" fill="#94a3b8">• FKs lógicas definidas por propiedades de dominio</text><text x="1095" y="802" fill="#94a3b8">• DELETE realiza borrado físico</text><text x="1095" y="834" fill="#94a3b8">• Seed inicial: 4 equipos, 20 jugadores, 6 partidos</text>
  </g>
  <text x="800" y="950" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#64748b">SoccerPro.Infrastructure.Persistence.SoccerProDbContext</text>
</svg>
